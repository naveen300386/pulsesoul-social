<!DOCTYPE html><html><head><meta charset='utf-8'><style>
@font-face{font-family:P;src:url('/usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf')}
@font-face{font-family:P;font-weight:500;src:url('/usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf')}
@font-face{font-family:P;font-weight:700;src:url('/usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf')}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{width:1080px;height:2280px;font-family:P,sans-serif;overflow:hidden;position:relative;
     background:#DCE3D4;color:#1E1B16}
.topbar{position:absolute;top:0;left:0;right:0;height:150px;background:#E3D8C2;display:flex;
        align-items:center;gap:26px;padding:0 30px;z-index:5}
.back{width:56px;height:56px;border-radius:50%;background:#F3EDE4;display:flex;align-items:center;
      justify-content:center}
.back svg{width:28px;height:28px;stroke:#1E1B16;fill:none;stroke-width:2.6}
.topbar h1{font-size:38px;font-weight:700}
.topbar .sub{font-size:24px;color:#6B6459;margin-top:4px}
.map{position:absolute;top:150px;left:0;right:0;bottom:0}
.block{position:absolute;background:#CBD6BF;border-radius:10px}
.road{position:absolute;background:#EDE6DB}
.pin-wrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%)}
.pulse{position:absolute;left:50%;top:100%;width:70px;height:70px;border-radius:50%;
       background:#D32F2F;opacity:.22;transform:translate(-50%,-50%)}
.pulse.p2{width:130px;height:130px;opacity:.14}
.pin{width:96px;height:118px;position:relative}
.pin svg{width:100%;height:100%}
.avatar{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:52px;height:52px;
        border-radius:50%;background:#E0788A;display:flex;align-items:center;justify-content:center;
        color:#fff;font-size:24px;font-weight:700;border:3px solid #fff}
.sheet{position:absolute;left:26px;right:26px;bottom:34px;background:#F3EDE4;border-radius:40px;
       padding:40px 40px 46px;box-shadow:0 -30px 60px -30px #00000030}
.sheet .row1{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font-size:42px;font-weight:700}
.live{display:flex;align-items:center;gap:10px;background:#E9F5EC;color:#2E7D46;font-size:24px;
      font-weight:700;border-radius:18px;padding:10px 20px}
.live .dot{width:12px;height:12px;border-radius:50%;background:#2E7D46}
.sheet .when{font-size:28px;color:#6B6459;margin-top:14px}
.actions{display:flex;gap:20px;margin-top:32px}
.actions .btn{flex:1;height:96px;border-radius:28px;display:flex;align-items:center;justify-content:center;
              gap:14px;font-size:30px;font-weight:700}
.actions svg{width:34px;height:34px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.call{background:#E0A63A;color:#3A2A08}
.call svg{stroke:#3A2A08}
.msg{background:#EBE3D6;color:#1E1B16}
.msg svg{stroke:#1E1B16}
.foot{margin-top:30px;font-size:23px;color:#8A8378;text-align:center}
</style></head><body>
<div class="topbar"><span class="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
  <div><h1>Priya&rsquo;s location</h1><div class="sub">Shared from her SOS alert</div></div></div>
<div class="map">
  <div class="road" style="left:0;right:0;top:18%;height:26px"></div>
  <div class="road" style="left:0;right:0;top:62%;height:22px"></div>
  <div class="road" style="left:22%;top:0;bottom:0;width:24px"></div>
  <div class="road" style="left:68%;top:0;bottom:0;width:20px"></div>
  <div class="block" style="left:6%;top:4%;width:220px;height:190px"></div>
  <div class="block" style="left:36%;top:6%;width:260px;height:150px"></div>
  <div class="block" style="left:74%;top:4%;width:230px;height:210px"></div>
  <div class="block" style="left:6%;top:26%;width:200px;height:280px"></div>
  <div class="block" style="left:74%;top:28%;width:230px;height:230px"></div>
  <div class="block" style="left:6%;top:66%;width:230px;height:220px"></div>
  <div class="block" style="left:36%;top:66%;width:260px;height:220px"></div>
  <div class="block" style="left:74%;top:66%;width:230px;height:220px"></div>
  <div class="pin-wrap">
    <div class="pulse p2"></div><div class="pulse"></div>
    <div class="pin"><svg viewBox="0 0 96 118"><path d="M48 4C24 4 6 22 6 45c0 32 42 69 42 69s42-37 42-69C90 22 72 4 48 4z"
         fill="#D32F2F" stroke="#fff" stroke-width="4"/></svg>
      <span class="avatar">P</span></div>
  </div>
</div>
<div class="sheet">
  <div class="row1"><h2>Priya&rsquo;s location</h2><span class="live"><span class="dot"></span>Live</span></div>
  <div class="when">Updates automatically &middot; shared 40 sec ago</div>
  <div class="actions">
    <div class="btn call"><svg viewBox="0 0 24 24"><path d="M5.2 3.6h3.9l1.9 4.8-2.8 1.9a12.4 12.4 0 005.5 5.5l1.9-2.8 4.8 1.9v3.9a1.8 1.8 0 01-1.8 1.8A16.8 16.8 0 013.4 5.4a1.8 1.8 0 011.8-1.8z"/></svg>Call Priya</div>
    <div class="btn msg"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="14" rx="3"/><path d="M7 21.2l1.2-3.2h3.4z"/></svg>Message</div>
  </div>
  <div class="foot">Family only &middot; never emergency services</div>
</div>
</body></html>
